    tl.fromTo("#l-en", { scale: 1.46, filter: "blur(8px)" }, { scale: 1.4, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
    tl.fromTo("#n-en", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18 }, 0.3);
    LANGS.slice(1).forEach(([code, t], i) => {
      const prev = LANGS[i][0];
      tl.set([`#l-${prev}`, `#n-${prev}`], { opacity: 0 }, t);
      tl.set(`#l-${code}`, { opacity: 1 }, t);
      tl.fromTo(`#n-${code}`, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15 }, t);
    });

    window.__timelines["languages"] = tl;
  </script>
</template>
