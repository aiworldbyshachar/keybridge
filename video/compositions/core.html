  <script>
    const tl = gsap.timeline({ paused: true });
    // Text, classes and values change through tweens that state both sides, so any seek (back or forth,
    // or a scene shown again) lands on the right state. "Empty" is a zero-width space, never "".
    const ZW = "\u200b";
    const swap = (sel, attr, from, to, t) =>
      tl.fromTo(sel, { attr: { [attr]: from || ZW } }, { attr: { [attr]: to || ZW }, duration: 0.001, ease: "none", immediateRender: false }, t);
    const SIG = "Best regards,\nDana Levi\nExample Ltd.";
    // Scene time = film time - 28.0
    const down = (sel, t) => tl.to(sel, { y: 7, borderBottomWidth: 1, duration: 0.067, ease: "power2.out" }, t);
    const up = (sel, t) => tl.to(sel, { y: 0, borderBottomWidth: 7, duration: 0.1, ease: "power2.out" }, t);
    const ROW = '#c-win [aria-label="Right Shift + E - Email"]';

    gsap.set(["#c-keys-r", "#c-keys-l", "#c-win", "#c-e", "#c-about-caret"], { opacity: 0 });
    gsap.set("#c-ring-path", { strokeDashoffset: 1 });
    gsap.set("#c-email", { attr: { "data-text": ZW } });
    gsap.set("#c-email-box", { attr: { class: "in focus" } });
    gsap.set("#c-about-box", { attr: { class: "in tall" } });
    gsap.set("#c-win", { scale: 1.6 });

    // the page settles in (cut from the wordmark)
    tl.fromTo("#c-browser", { scale: 1.04, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);

    // "Right Shift and E... there it is": the whole address lands at once
    tl.fromTo("#c-keys-r", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
    down("#c-rshift", 0.6);
    down("#c-re", 1.2);
    swap("#c-email", "data-text", "", "dana.levi@example.com", 1.27);
    tl.fromTo("#c-email-box", { scale: 1 }, { scale: 1.015, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 1.27);
    up("#c-re", 1.4);
    up("#c-rshift", 1.55);

    // "Left Shift and E? Still just a capital E."
    tl.to("#c-keys-r", { opacity: 0, y: -20, duration: 0.2, ease: "power3.in" }, 2.85);
    tl.fromTo("#c-keys-l", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 3.05);
    swap("#c-email-box", "class", "in focus", "in", 3.0);
    tl.set("#c-email-caret", { opacity: 0 }, 3.0);
    swap("#c-about-box", "class", "in tall", "in tall focus", 3.0);
    tl.set("#c-about-caret", { opacity: 1 }, 3.0);
    down("#c-lshift", 3.5);
    down("#c-le", 4.05);
    tl.set("#c-e", { opacity: 1 }, 4.12);
    up("#c-le", 4.3);
    up("#c-lshift", 4.45);
    tl.to("#c-ring-path", { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 5.55);

    // "Left and right are different keys": the real KeyBridge window, the Email shortcut's keys
    tl.to("#c-world", { opacity: 0, filter: "blur(12px)", duration: 0.25, ease: "power3.in" }, 7.0);
    tl.fromTo("#c-win", { opacity: 0, scale: 1.68, filter: "blur(8px)" }, { opacity: 1, scale: 1.6, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 7.12);
    tl.to(`${ROW} .cap`, { boxShadow: "0 0 0 3px #5550d8", backgroundColor: "#ebebfd", duration: 0.25, ease: "power2.out", stagger: 0.12 }, 7.95);
    tl.to(ROW, { backgroundColor: "#ffffff", boxShadow: "0 6px 20px rgba(85, 80, 216, 0.18)", duration: 0.3, ease: "power2.out" }, 7.95);

    window.__timelines["core"] = tl;
