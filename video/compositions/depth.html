  <script>
    const tl = gsap.timeline({ paused: true });
    // Text, classes and values change through tweens that state both sides, so any seek (back or forth,
    // or a scene shown again) lands on the right state. "Empty" is a zero-width space, never "".
    const ZW = "\u200b";
    const swap = (sel, attr, from, to, t) =>
      tl.fromTo(sel, { attr: { [attr]: from || ZW } }, { attr: { [attr]: to || ZW }, duration: 0.001, ease: "none", immediateRender: false }, t);
    const SIG = "Best regards,\nDana Levi\nExample Ltd.";
    // Scene time = film time - 46.5
    const down = (sel, t) => tl.to(sel, { y: 7, borderBottomWidth: 1, duration: 0.067, ease: "power2.out" }, t);
    const up = (sel, t) => tl.to(sel, { y: 0, borderBottomWidth: 7, duration: 0.1, ease: "power2.out" }, t);
    const pop = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, t);
    const ROW2 = "#p-trash .trash-list .row:nth-child(2)";

    gsap.set(["#p-b", "#p-trash", "#p-space", "#p-keys-c", "#p-cal", "#p-files", "#p-calc"], { opacity: 0 });
    gsap.set("#p-trash", { scale: 1.6 });
    gsap.set('#p-trash [data-id="toast"]', { attr: { "data-text": ZW, class: "toast" } });
    gsap.set(["#p-abbr", "#p-sig"], { attr: { "data-text": ZW } });
    gsap.set("#p-cursor", { x: 1500, y: 1120 });

    // A. "Type a short word for your whole signature"
    tl.fromTo("#p-mail", { scale: 1.03, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);
    ";sig".split("").forEach((c, i) => swap("#p-abbr", "data-text", ";sig".slice(0, i), ";sig".slice(0, i + 1), 0.7 + i * 0.08));
    tl.fromTo("#p-space", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 1.2);
    down("#p-space", 1.82);
    swap("#p-abbr", "data-text", ";sig", "", 1.9);
    swap("#p-sig", "data-text", "", SIG, 1.9);
    up("#p-space", 2.05);
    tl.to("#p-space", { opacity: 0, y: 20, duration: 0.2, ease: "power3.in" }, 2.7);

    // B. "Open a link, a folder or a program with one key"
    tl.to("#p-a", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 3.0);
    tl.fromTo("#p-b", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.05);
    tl.fromTo("#p-keys-c", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 3.1);
    down("#p-ralt", 3.4);
    down("#p-c", 3.55);
    pop("#p-cal", 3.62);
    up("#p-c", 3.75);
    up("#p-ralt", 3.85);
    tl.to("#p-keys-c", { opacity: 0, y: -20, duration: 0.2, ease: "power3.in" }, 4.1);
    pop("#p-files", 4.3);
    pop("#p-calc", 5.11);

    // C. "And nothing you delete is ever lost": the Trash, Restore
    tl.to("#p-b", { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 6.85);
    tl.fromTo("#p-trash", { opacity: 0, scale: 1.68, filter: "blur(8px)" }, { opacity: 1, scale: 1.6, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 6.95);
    tl.to("#p-cursor", { x: 1222, y: 318, duration: 0.5, ease: "expo.out" }, 7.35);
    tl.to(`${ROW2} button:first-of-type`, { scale: 0.95, duration: 0.067, yoyo: true, repeat: 1, ease: "power2.out" }, 7.9);
    tl.to(ROW2, { opacity: 0, x: 40, duration: 0.2, ease: "power3.in" }, 8.0);
    tl.to("#p-trash .trash-list .row:nth-child(3)", { y: -65, duration: 0.25, ease: "power2.inOut" }, 8.2);
    tl.to("#p-cursor", { opacity: 0, duration: 0.2 }, 8.3);
    swap('#p-trash [data-id="toast"]', "class", "toast", "toast show", 8.66);
    swap('#p-trash [data-id="toast"]', "data-text", "", "Restored", 8.66);

    window.__timelines["depth"] = tl;
  </script>
