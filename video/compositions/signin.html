    <svg id="s-cursor" class="cursor" viewBox="0 0 22 32"><path d="M2 2 L2 26 L8 20 L12 30 L16 28 L12 18.5 L20 18.5 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round" /></svg>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Text, classes and values change through tweens that state both sides, so any seek (back or forth,
    // or a scene shown again) lands on the right state. "Empty" is a zero-width space, never "".
    const ZW = "\u200b";
    const swap = (sel, attr, from, to, t) =>
      tl.fromTo(sel, { attr: { [attr]: from || ZW } }, { attr: { [attr]: to || ZW }, duration: 0.001, ease: "none", immediateRender: false }, t);
    const SIG = "Best regards,\nDana Levi\nExample Ltd.";
    // Scene time = film time - 37.5. The big window: 1.55x from (231, 64), so window (x, y) is frame (231 + 1.55x, 64 + 1.55y).
    const S = 1.55;
    const at = (x, y) => ({ x: 231 + S * x, y: 64 + S * y });
    const click = (sel, t) => tl.to(sel, { scale: 0.95, duration: 0.067, yoyo: true, repeat: 1, ease: "power2.out" }, t);
    const moveTo = (p, t, d) => tl.to("#s-cursor", { x: p.x, y: p.y, duration: d || 0.4, ease: "expo.out" }, t);
    const EMAIL = "dana@example.com";
    const CODE = "K7QM4XRTP9WE";
    const TEMPLATE = "XXXX-XXXX-XXXX";

    gsap.set(["#s-win1", "#s-win2", "#s-win3"], { scale: S });
    // the code box's ghost text, as data-text so it undoes on a backward seek
    document.querySelector("#s-win2 .code-ghost span:last-child").textContent = "";
    gsap.set("#s-win2 .code-ghost .typed", { attr: { "data-text": ZW } });
    gsap.set(["#s-win1 input[type=email]", "#s-win2 .code-input"], { attr: { value: ZW } });
    gsap.set("#s-win2 .code-ghost span:last-child", { attr: { "data-text": TEMPLATE } });
    gsap.set(["#s-win2", "#s-win3", "#s-desk", "#s-pcwin", "#s-arch", "#s-rule span"], { opacity: 0 });
    gsap.set("#s-pcwin", { scale: 0.58 });
    gsap.set("#s-arch-path", { strokeDashoffset: 1 });
    gsap.set("#s-cursor", { x: 1500, y: 1120 });

    // "On your Mac": the KeyBridge window, not signed in yet
    tl.fromTo("#s-win1", { scale: S * 1.04, filter: "blur(6px)" }, { scale: S, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 0);

    // "sign in": the email, then Send link
    moveTo(at(600, 196), 0.75);
    click("#s-win1 input[type=email]", 1.15);
    for (let i = 1; i <= EMAIL.length; i++) swap("#s-win1 input[type=email]", "value", EMAIL.slice(0, i - 1), EMAIL.slice(0, i), 1.2 + i * 0.05);
    moveTo(at(728, 187), 2.1, 0.35);
    click('#s-win1 [data-id="account-body"] .btn.primary', 2.5);
    tl.set("#s-win1", { opacity: 0 }, 2.6);
    tl.set("#s-win2", { opacity: 1 }, 2.6);

    // "and type your code once": the template fills, the hyphens come by themselves
    moveTo(at(728, 146), 2.65, 0.35);
    let prev = "";
    for (let n = 1; n <= CODE.length; n++) {
      const v = (CODE.slice(0, n).match(/.{1,4}/g) || []).join("-") + (n % 4 === 0 && n < 12 ? "-" : "");
      const t = 2.7 + n * 0.065;
      swap("#s-win2 .code-input", "value", prev, v, t);
      swap("#s-win2 .code-ghost .typed", "data-text", prev, v, t);
      swap("#s-win2 .code-ghost span:last-child", "data-text", TEMPLATE.slice(prev.length), TEMPLATE.slice(v.length), t);
      prev = v;
    }
    click('#s-win2 [data-id="account-body"] .btn.primary', 3.58);

    // "Every shortcut is there": the list fills
    tl.set("#s-win2", { opacity: 0 }, 3.66);
    tl.set("#s-win3", { opacity: 1 }, 3.66);
    tl.fromTo("#s-win3 .row", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out", stagger: 0.07 }, 3.66);
    tl.to("#s-cursor", { opacity: 0, duration: 0.2 }, 3.9);
    // the Mac's own keys: Right Cmd, Right Option
    tl.to(['#s-win3 [aria-label="Right Cmd + 1 - Meeting reply"] .cap', '#s-win3 [aria-label="Right Option + C - Team calendar"] .cap'],
      { boxShadow: "0 0 0 3px #5550d8", backgroundColor: "#ebebfd", duration: 0.25, ease: "power2.out", stagger: 0.1 }, 4.6);

    // "The only rule: sign in on each computer": the window settles into the Mac, the PC has the same
    tl.to("#s-mac", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.4);
    tl.to("#s-desk", { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.4);
    tl.to("#s-win3", { x: 228 - 231, y: 359 - 64, scale: 0.62, duration: 0.65, ease: "power2.inOut" }, 5.4);
    tl.fromTo("#s-pcwin", { opacity: 0, scale: 0.62 }, { opacity: 1, scale: 0.58, duration: 0.45, ease: "expo.out" }, 5.75);
    tl.set("#s-arch", { opacity: 1 }, 6.0);
    tl.to("#s-arch-path", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 6.0);
    tl.fromTo("#s-rule span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.08 }, 6.74);

    window.__timelines["signin"] = tl;
  </script>
