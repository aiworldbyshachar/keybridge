  <script>
    const tl = gsap.timeline({ paused: true });
    // Text, classes and values change through tweens that state both sides, so any seek (back or forth,
    // or a scene shown again) lands on the right state. "Empty" is a zero-width space, never "".
    const ZW = "\u200b";
    const swap = (sel, attr, from, to, t) =>
      tl.fromTo(sel, { attr: { [attr]: from || ZW } }, { attr: { [attr]: to || ZW }, duration: 0.001, ease: "none", immediateRender: false }, t);
    const SIG = "Best regards,\nDana Levi\nExample Ltd.";
    // Scene time = film time - 56.2
    const tap = (sel, t) => tl.to(sel, { y: 6, borderBottomWidth: 1, duration: 0.05, yoyo: true, repeat: 1, ease: "power2.out" }, t);
    const SEALED = ["v1.k9Qx2fLp7wZt4mB0q8Rv", "v1.Zt4mB0q8Rv1k9Qx2fLp7", "v1.q8Rv1Zt4k9Qx2mB0fLp7", "v1.7wZt4k9Qx2fLp0q8RvmB"];

    gsap.set("#v-stage", { x: 60, y: 40 });
    const PLAIN = "Email · dana.levi@example.com";
    gsap.set("#v-sealed-text", { attr: { "data-text": PLAIN } });
    gsap.set(["#v-typed", "#v-heard-line"], { attr: { "data-text": ZW } });
    gsap.set(["#v-lock", "#v-code", "#v-sealed", "#v-two"], { opacity: 0 });
    gsap.set("#v-sealed", { x: 300, y: 420 });

    // 1. "Your shortcuts are locked with a code only you have"
    tl.fromTo("#v-card", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
    tl.fromTo("#v-lock", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 1.16);
    tl.fromTo("#v-code", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 1.82);
    // "before they leave your computer": what leaves is sealed
    tl.fromTo("#v-sealed", { opacity: 0, x: 300, y: 420 }, { opacity: 1, y: 340, duration: 0.4, ease: "expo.out" }, 3.5);
    SEALED.forEach((s, i) => swap("#v-sealed-text", "data-text", i ? SEALED[i - 1] : PLAIN, s, 3.75 + i * 0.12));
    tl.to("#v-sealed", { x: 1390, duration: 1.0, ease: "power1.inOut" }, 3.93);
    tl.to("#v-sealed", { y: 250, duration: 1.0, ease: "power2.out" }, 3.93);
    // "so nobody else can read them": the cloud holds only the sealed copy
    tl.to("#v-sealed", { x: 1345, y: 300, duration: 0.5, ease: "power2.inOut" }, 5.2);

    // 2. "And KeyBridge never records what you type"
    tl.fromTo("#v-two", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.35);
    tl.set("#v-one", { opacity: 0 }, 7.62);
    const words = "Reach me at ";
    [...words].forEach((c, i) => {
      const t = 7.7 + i * 0.075;
      swap("#v-typed", "data-text", words.slice(0, i), words.slice(0, i + 1), t);
      if (c !== " ") tap(`#k-${c.toLowerCase()}`, t - 0.02);
      if (c === "R") tap("#k-ls", t - 0.04);
    });
    // Right Shift + E: the address lands, and that's the one thing KeyBridge hears
    tl.to("#k-rs", { y: 6, borderBottomWidth: 1, duration: 0.05, ease: "power2.out" }, 9.15);
    tap("#k-e", 9.25);
    tl.to("#k-rs", { y: 0, borderBottomWidth: 5, duration: 0.08, ease: "power2.out" }, 9.45);
    swap("#v-typed", "data-text", words, words + "dana.levi@example.com", 9.3);
    swap("#v-heard-line", "data-text", "", "Email - pressed", 9.32);
    tl.fromTo("#v-heard-line", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 9.32);

    window.__timelines["privacy"] = tl;
  </script>
